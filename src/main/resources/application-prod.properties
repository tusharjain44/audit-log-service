# STRICT SEC-09: Hardened Production Configuration
spring.datasource.url=${PROD_DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PROD_DB_USER}
spring.datasource.password=${PROD_DB_PASSWORD}

# Disable all H2 and development features
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Require TLS/HTTPS for the embedded web server
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE_PATH}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=audit-service
