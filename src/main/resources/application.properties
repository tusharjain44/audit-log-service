spring.datasource.url=${DB_URL:jdbc:h2:mem:auditdb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER:audit_sa}
spring.datasource.password=${DB_PASSWORD:SecureDbPass2026!}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

audit.admin.password=${ADMIN_PASSWORD:DefaultAdminPass2026!}
audit.user.password=${USER_PASSWORD:DefaultUserPass2026!}
